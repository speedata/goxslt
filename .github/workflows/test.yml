name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Lower bound is the version required by go.mod.
        go: ['1.25.x', 'stable']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - run: go vet ./...
      - run: go test ./...

  race:
    name: Race detector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: go test -race ./...

  xslt30:
    name: W3C XSLT 3.0 conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check out the XSLT 3.0 test suite
        uses: actions/checkout@v7
        with:
          repository: w3c/xslt30-test
          # Pinned so an upstream change cannot silently move the set of test
          # cases whitelisted in w3c_test.go. Bump together with the whitelist.
          ref: 4fc73264fb9ac3dbf3f67413427eccd76f231142
          path: testdata/w3c
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      # Fails if any test case whitelisted in w3c_test.go regresses.
      - run: go test -v -run TestW3C .

  crossbuild:
    name: Cross build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: '386'
          - goos: linux
            goarch: arm
          - goos: windows
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build ./...
